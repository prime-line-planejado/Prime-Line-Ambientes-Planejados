<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
  <!-- ── Símbolo arquitetônico ──────────────────────────────────── -->
  <!-- Elemento esquerdo: armário/estante (H com crossbar baixo) -->
  <!-- Vertical esquerda externa -->
  <line x1="4"  y1="20" x2="4"  y2="62" stroke="#B09030" stroke-width="3" stroke-linecap="square"/>
  <!-- Horizontal inferior esq -->
  <line x1="4"  y1="62" x2="28" y2="62" stroke="#B09030" stroke-width="3" stroke-linecap="square"/>
  <!-- Vertical interna esq (coluna central) -->
  <line x1="14" y1="38" x2="14" y2="62" stroke="#B09030" stroke-width="3" stroke-linecap="square"/>
  <!-- Crossbar horizontal esq -->
  <line x1="4"  y1="38" x2="28" y2="38" stroke="#B09030" stroke-width="3" stroke-linecap="square"/>
  <!-- Vertical direita do elem esq -->
  <line x1="28" y1="38" x2="28" y2="62" stroke="#B09030" stroke-width="3" stroke-linecap="square"/>

  <!-- Elemento direito: porta/moldura retangular -->
  <line x1="36" y1="10" x2="62" y2="10" stroke="#B09030" stroke-width="3" stroke-linecap="square"/>
  <line x1="36" y1="62" x2="62" y2="62" stroke="#B09030" stroke-width="3" stroke-linecap="square"/>
  <line x1="36" y1="10" x2="36" y2="62" stroke="#B09030" stroke-width="3" stroke-linecap="square"/>
  <line x1="62" y1="10" x2="62" y2="62" stroke="#B09030" stroke-width="3" stroke-linecap="square"/>

  <!-- ── Divisor vertical ──────────────────────────────────────── -->
  <line x1="80" y1="14" x2="80" y2="58" stroke="#B09030" stroke-width="1"/>

  <!-- ── Tipografia: PRIME LINE ────────────────────────────────── -->
  <text x="94" y="36"
        font-family="'Montserrat', Arial, sans-serif"
        font-size="22" font-weight="700" letter-spacing="3"
        fill="#FFFFFF">PRIME</text>
  <text x="94" y="56"
        font-family="'Montserrat', Arial, sans-serif"
        font-size="22" font-weight="700" letter-spacing="3"
        fill="#FFFFFF">LINE</text>

  <!-- ── Linha separadora abaixo de PRIME LINE ────────────────── -->
  <line x1="94" y1="62" x2="230" y2="62" stroke="#B09030" stroke-width="0.8"/>

  <!-- ── PLANEJADOS ─────────────────────────────────────────────── -->
  <text x="94" y="72"
        font-family="'Montserrat', Arial, sans-serif"
        font-size="9" font-weight="400" letter-spacing="5"
        fill="#B09030">PLANEJADOS</text>
</svg>
