<svg width="320" height="110" viewBox="0 0 320 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prime Line Planejados">
  <title>Prime Line Planejados</title>

  <!-- Marca geométrica: módulos de móvel planejado -->
  <g transform="translate(20, 22)">
    <rect x="0"  y="52" width="54" height="3"  fill="#c4a96e"/>
    <rect x="0"  y="8"  width="3"  height="47" fill="#c4a96e"/>
    <rect x="18" y="18" width="3"  height="37" fill="#a8905a"/>
    <rect x="3"  y="33" width="15" height="2"  fill="#a8905a"/>
    <rect x="30" y="8"  width="3"  height="47" fill="#c4a96e"/>
    <rect x="30" y="8"  width="24" height="3"  fill="#c4a96e"/>
    <rect x="51" y="8"  width="3"  height="47" fill="#a8905a"/>
  </g>

  <!-- Divisória vertical fina -->
  <line x1="92" y1="18" x2="92" y2="92" stroke="#c4a96e" stroke-width="0.5" opacity="0.6"/>

  <!-- PRIME -->
  <text
    x="106" y="52"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-size="36"
    font-weight="600"
    letter-spacing="6"
    fill="#f0e8d8"
  >PRIME</text>

  <!-- LINE -->
  <text
    x="106" y="74"
    font-family="'Cormorant Garamond', Georgia, serif"
    font-size="36"
    font-weight="300"
    letter-spacing="8"
    fill="#c4a96e"
  >LINE</text>

  <!-- Linha decorativa -->
  <line x1="106" y1="82" x2="300" y2="82" stroke="#c4a96e" stroke-width="0.5" opacity="0.5"/>

  <!-- PLANEJADOS -->
  <text
    x="106" y="96"
    font-family="'Montserrat', Arial, sans-serif"
    font-size="9"
    font-weight="300"
    letter-spacing="4.5"
    fill="#a8905a"
  >PLANEJADOS</text>
</svg>
